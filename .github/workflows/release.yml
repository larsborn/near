name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            os=${target%/*}; arch=${target#*/}
            bin=near; [ "$os" = windows ] && bin=near.exe
            dir="near-${VERSION}-${os}-${arch}"
            mkdir -p "build/$dir"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "build/$dir/$bin" .
            cp README.md LICENSE "build/$dir/" 2>/dev/null || cp README.md "build/$dir/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$dir.zip" "$dir")
            else
              tar -C build -czf "dist/$dir.tar.gz" "$dir"
            fi
            echo "built $dir"
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "NEAR ${{ github.ref_name }}" \
            --generate-notes
